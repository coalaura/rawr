name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY_NAME: rawr

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - windows
          - linux
          - darwin
        goarch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        id: build
        uses: coalaura/build@v1
        with:
          os: ${{ matrix.goos }}
          arch: ${{ matrix.goarch }}
          optimization: compatible
          generate: false
          output: dist/${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          go-flags: |
            -ldflags=-X main.Version=${{ github.ref_name }}

      - name: Sign
        id: sign
        uses: coalaura/sign@v1
        with:
          path: ${{ steps.build.outputs.path }}
          key: ${{ secrets.COALAURA_PFX }}
          passphrase: ${{ secrets.COALAURA_PFX_PASSWORD }}
          chain: |
            https://wiese2.org/pki/issuing.pem
            https://wiese2.org/pki/root.pem

      - name: Upload signed binaries
        uses: actions/upload-artifact@v7
        with:
          name: signed-${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.sign.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download signed binaries
        uses: actions/download-artifact@v8
        with:
          pattern: signed-${{ env.BINARY_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -b ${BINARY_NAME}-* > SHA256SUMS

      - name: Attest signed binaries
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ env.BINARY_NAME }}-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
