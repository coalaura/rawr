name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY_NAME: rawr
  BUILDER_VERSION: v0.3.0

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - windows
          - linux
          - darwin
        goarch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: |
          extension=""
          if [[ "$GOOS" == "windows" ]]; then
            extension=".exe"
          fi

          mkdir -p dist
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o "dist/${BINARY_NAME}-${GOOS}-${GOARCH}${extension}" \
            .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install builder
        run: go install github.com/coalaura/builder@${BUILDER_VERSION}

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Sign binaries
        shell: bash
        env:
          COALAURA_PFX: ${{ secrets.COALAURA_PFX }}
          COALAURA_PFX_PASSWORD: ${{ secrets.COALAURA_PFX_PASSWORD }}
        run: |
          set -euo pipefail

          umask 077
          pfx_path="$RUNNER_TEMP/coalaura.pfx"
          trap 'rm -f "$pfx_path"' EXIT

          printf '%s' "$COALAURA_PFX" | base64 --decode > "$pfx_path"

          for binary in dist/${BINARY_NAME}-*; do
            builder sign "$binary" \
              --sign "$pfx_path" \
              --passphrase "$COALAURA_PFX_PASSWORD" \
              --sign-chain https://wiese2.org/pki/issuing.pem \
              --sign-chain https://wiese2.org/pki/root.pem
          done

          cd dist
          sha256sum -b ${BINARY_NAME}-* > SHA256SUMS

      - name: Upload signed binaries
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed binaries
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
